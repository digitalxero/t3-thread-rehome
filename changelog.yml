    - commit: fff6434226902e2b55a8a903001047f033cf7728
      note: |-
        feat(move): move a thread to another machine with its conversation and work

        Implements pingdotgg/t3code#31077 as a T3 Code plugin. A move is a copy and
        then an archive: a running turn is stopped, the working tree is snapshotted,
        and the snapshot plus every commit the destination lacks travel as a Git
        bundle with the conversation. The destination creates the branch, a worktree
        and the thread, and only then is the original archived, so a failed move
        loses nothing.

        Two transports share one engine. The button in a thread's details carries the
        copy through the client in small steps, which works over any connection. The
        pull command lets the destination fetch from the source's HTTP endpoint with a
        transfer key, for agents, other plugins, and sources behind NAT.

        Co-Authored-By: Claude Fable 5.2 <noreply@anthropic.com>
