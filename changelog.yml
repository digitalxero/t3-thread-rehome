    - commit: 4a83fc40e618cc7314eb9037e9c343344da55e9f
      note: |-
        refactor(ui): remove the settings page so the plugin is one button (#3)

        The settings page only served the headless pull: it created the source's
        transfer key, saved named sources and listed recent moves. None of that is
        needed to move a thread from its details. The page, its four commands, the
        saved sources and the move journal are gone.

        Pull stays for callers with no app in the middle. The source allows it only
        when its server is started with T3_REHOME_TRANSFER_KEY, and the caller passes
        the source as { url, key }.

        Co-authored-by: Claude Fable 5.2 <noreply@anthropic.com>
